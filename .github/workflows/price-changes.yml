name: FPL Price Changes

on:
  schedule:
    # FPL applies price changes ~01:30 UK. Run at 02:00 UTC to be safe
    # across BST/GMT (adjust if you want to pin exact UK local time).
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  price-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node jobs/priceChanges.js
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
