name: FPL Live Points

on:
  schedule:
    # Every 15 min, 11:00-23:00 UTC only — covers all realistic kickoff
    # windows without polling 24/7. The job itself also gates on
    # fixtures actually having started, so off-hours/no-fixture runs
    # exit in a couple seconds either way.
    - cron: '*/15 11-23 * * *'
  workflow_dispatch: {}

jobs:
  live-points:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node jobs/livePoints.js
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
